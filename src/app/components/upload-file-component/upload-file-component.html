<h1>Subida de Ficheros a API</h1>

<form #uploadform="ngForm" (ngSubmit)="subirFichero()">
    <div class="form-group">
        <label>Nombre del fichero:</label>
        <input type="text" #cajanombre class="form-control" />
    </div>

    <div class="form-group">
        <label>Seleccionar Fichero/Imagen:</label>
        <input type="file" #cajafichero class="form-control" />
    </div>

    <br />
    <button class="btn btn-primary">Subir Fichero</button>
</form>

@if (mensaje) {
<h2 style="color: blue">{{ mensaje }}</h2>
}
